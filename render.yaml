services:
  - type: web
    name: elfura
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/v1/health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      # Signs playback sessions and the sealed playback envelope. Generated once
      # at first deploy; changing it invalidates every link minted before.
      - key: ELFURA_SECRET
        generateValue: true
      # "*" for testing. Put your real site origins here when you go live.
      - key: ALLOWED_ORIGINS
        value: "*"
      # 0 = the embed plays without a session token. Testing only: set 1 in
      # production so a copied /api/v1/playback URL is worthless.
      - key: REQUIRE_PLAYBACK_TOKEN
        value: "0"
      - key: ELFURA_QUIET_ENV
        value: "1"
      # Free instances get 512 MB. A heap ceiling makes V8 fail a request
      # cleanly instead of being OOM-killed by the cgroup mid-stream.
      - key: ELFURA_MAX_OLD_SPACE_MB
        value: "384"
      # Optional. Without it the embed still works but title metadata is sparse
      # and some sources cannot resolve. Set it in the dashboard, never in git.
      - key: TMDB_API_KEY
        sync: false
