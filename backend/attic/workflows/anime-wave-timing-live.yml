name: Anime source live timing research
on:
  push:
    branches: [arena/124b7afe-elfura]
    paths: ['backend/src/sources/source29.ts', 'backend/test/source29.mjs', 'backend/test/anime-wave-timing-live.mjs', '.github/workflows/anime-wave-timing-live.yml']
  workflow_dispatch:
permissions: {contents: read}
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22, cache: npm}
      - run: npm ci
      - run: npm run build
      - run: npm install --no-save --no-package-lock playwright-core @sparticuz/chromium
      - name: Measure live sources
        run: |
          set +e
          node backend/test/anime-wave-timing-live.mjs 2>anime-errors.log
          status=$?
          if [ "$status" -ne 0 ]; then
            node -e "const fs=require('fs');const t=fs.readFileSync('anime-errors.log','utf8').slice(-3000).replace(/https?:\\/\\/[^\\s)]+/g,'[url]').replace(/%/g,'%25').replace(/\\n/g,'%0A');console.log('::error title=Research stderr::'+t)"
          fi
          exit "$status"
