name: Live general source waves
on:
  push:
    branches: [arena/124b7afe-elfura]
    paths: ['.github/workflows/live-general-waves.yml', 'backend/test/live-general-waves.mjs', 'backend/src/sources/registry.ts', 'backend/src/sources/source1.ts', 'backend/src/sources/source24.ts']
  workflow_dispatch:
permissions: {contents: read}
jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22, cache: npm}
      - run: npm ci
      - run: npm run build
      - run: npm install --no-save --no-package-lock playwright-core @sparticuz/chromium
      - run: node backend/test/live-general-waves.mjs
        env:
          ELFURA_LIVE_REPORT: live-general-report.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: live-general-report
          path: live-general-report.json
          if-no-files-found: ignore
          retention-days: 7
