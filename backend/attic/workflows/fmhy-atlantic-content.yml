name: Atlantic video comparison research
on:
  push:
    branches: [arena/124b7afe-elfura]
    paths: ['backend/test/fmhy-atlantic-content-comparison.mjs', '.github/workflows/fmhy-atlantic-content.yml']
  workflow_dispatch:
permissions: {contents: read}
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22, cache: npm}
      - run: npm ci
      - run: npm run build
      - run: npm install --no-save --no-package-lock playwright-core @sparticuz/chromium
      - run: node backend/test/fmhy-atlantic-content-comparison.mjs
