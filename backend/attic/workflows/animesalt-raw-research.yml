name: AnimeSalt raw stream research
on:
  push:
    branches: [arena/124b7afe-elfura]
    paths: ['backend/test/animesalt-raw-research.mjs', '.github/workflows/animesalt-raw-research.yml']
permissions: {contents: read}
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22, cache: npm}
      - run: npm ci
      - run: npm run build:backend
      - run: node backend/test/animesalt-raw-research.mjs
