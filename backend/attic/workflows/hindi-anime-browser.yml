name: Hindi anime browser audit
on:
  push:
    branches: [arena/124b7afe-elfura]
    paths: ['backend/test/hindi-anime-real-browser.mjs', '.github/workflows/hindi-anime-browser.yml']
permissions: {contents: read}
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22, cache: npm}
      - run: npm ci
      - run: npm run build
      - run: npm install --no-save --no-package-lock playwright-core @sparticuz/chromium
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - run: node backend/test/hindi-anime-real-browser.mjs
