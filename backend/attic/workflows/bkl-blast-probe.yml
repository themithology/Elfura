name: bkl-blast probe
on:
  push:
    branches: [arena/d642a0e9-elfura]
    paths: [scripts/probe-bkl-blast.mjs, .github/workflows/bkl-blast-probe.yml]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22, cache: npm}
      - run: npm ci
      - run: npm run build:backend
      - name: Probe
        run: SHOW_KEYS=1 node scripts/probe-bkl-blast.mjs > /tmp/probe.txt 2>&1 || true
      - name: Publish
        if: always()
        run: |
          git config user.name probe
          git config user.email probe@example.invalid
          git checkout --orphan bkl-blast-report
          cp /tmp/probe.txt bkl-blast-report.txt
          git add -f bkl-blast-report.txt
          git commit -q -m "bkl-blast probe"
          git push -f origin bkl-blast-report
