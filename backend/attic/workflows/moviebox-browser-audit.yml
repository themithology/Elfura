name: Real MovieBox browser audit
on:
  push:
    branches: [arena/124b7afe-elfura]
    paths: ['backend/test/moviebox-real-browser.mjs', '.github/workflows/moviebox-browser-audit.yml']
permissions: {contents: read}
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22, cache: npm}
      - run: npm ci
      - run: npm run build
      - run: npm install --no-save --no-package-lock playwright-core @sparticuz/chromium
      - run: node backend/test/moviebox-real-browser.mjs
