name: Jujutsu multilingual investigation
on:
  push:
    branches: [arena/dcf86284-elfura]
    paths: [backend/test/research-jujutsu.mjs, backend/test/research-nekomux.mjs, backend/test/research-anime-coverage.mjs, .github/workflows/research-jujutsu.yml]
permissions:
  contents: read
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npm install --no-save --no-package-lock playwright-core @sparticuz/chromium
      - run: node backend/test/research-anime-coverage.mjs
