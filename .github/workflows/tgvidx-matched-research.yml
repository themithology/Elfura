name: TGVIDX matched player and wire research
on:
  push:
    branches: [arena/124b7afe-elfura]
    paths: ['backend/test/tgvidx-wire-compare.mjs', 'backend/test/research-tgvidx-65942-browser.mjs', '.github/workflows/tgvidx-matched-research.yml']
  workflow_dispatch:
permissions: {contents: read}
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22, cache: npm}
      - run: npm ci
      - run: npm run build
      - run: npm install --no-save --no-package-lock playwright-core @sparticuz/chromium
      - run: node backend/test/tgvidx-wire-compare.mjs
      - run: node backend/test/research-tgvidx-65942-browser.mjs
      - run: node backend/test/source17-rezero-browser.mjs
