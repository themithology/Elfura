name: Skip and next episode browser regression
on:
  push:
    branches: [arena/dcf86284-elfura]
    paths: [src/core/player.ts, src/ui/controls.ts, src/ui/styles.css, backend/src/segments.ts, backend/src/index.ts, backend/test/skip-browser.mjs, backend/test/segments.mjs, backend/test/segments-live.mjs, .github/workflows/skip-browser.yml]
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - run: npm ci
      - run: npm run build
      - run: node backend/test/segments.mjs
      - name: Live timestamp availability (network dependent)
        run: node backend/test/segments-live.mjs
        continue-on-error: true
      - run: npm install --no-save --no-package-lock playwright-core @sparticuz/chromium @ffmpeg-installer/ffmpeg
      - run: node backend/test/skip-browser.mjs
