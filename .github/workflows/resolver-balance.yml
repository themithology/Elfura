name: Resolver load balancing
on:
  push:
    branches: [arena/124b7afe-elfura]
    paths:
      - 'backend/src/playback-resolver*.ts'
      - 'backend/src/sources/registry.ts'
      - 'backend/src/sources/liveness.ts'
      - 'backend/test/mp4-transient-coverage.mjs'
      - 'backend/test/late-wave-race.mjs'
      - 'backend/test/wave-*.mjs'
      - 'src/core/player.ts'
      - 'backend/src/index.ts'
      - 'backend/src/roxy-page.ts'
      - 'index.js'
      - 'elfura-pterodactyl.zip'
      - 'backend/test/resolver-balance*.mjs'
      - 'backend/test/resolver-late-waves.mjs'
      - '.github/workflows/resolver-balance.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22, cache: npm}
      - run: npm ci
      - run: npm run test:zip
      - run: node backend/test/resolver-balance.mjs
      - run: node backend/test/resolver-balance-integration.mjs
      - run: node backend/test/resolver-late-waves.mjs
      - run: node backend/test/late-wave-race.mjs
      - run: node backend/test/mp4-transient-coverage.mjs
      - run: ELFURA_RAM_CACHE=off node backend/test/mp4-transient-coverage.mjs
      - run: ELFURA_RAM_CACHE=off node backend/test/wave-pressure.mjs
      - run: ELFURA_RAM_CACHE=off node backend/test/wave-http-pressure.mjs
      - run: node backend/test/resolver-balance-package.mjs
      - run: npm install --no-save --no-package-lock playwright-core @sparticuz/chromium @ffmpeg-installer/ffmpeg
      - run: ELFURA_TEST_BROWSER=1 node backend/test/resolver-late-waves.mjs
      - run: node backend/test/timeout-ladder.mjs
      - run: node backend/test/standing-rules.mjs
