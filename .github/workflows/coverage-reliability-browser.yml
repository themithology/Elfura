name: Four-source playback browser verification
on:
  push:
    paths:
      - 'backend/src/sources/**'
      - 'backend/src/relay.ts'
      - 'src/core/player.ts'
      - 'backend/test/coverage-reliability-browser.mjs'
      - '.github/workflows/coverage-reliability-browser.yml'
  workflow_dispatch:
permissions: {contents: read}
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        source: [source-1, source-2, source-3, source-4]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22, cache: npm}
      - run: npm ci
      - run: npm run build
      - run: npm install --no-save --no-package-lock playwright-core @sparticuz/chromium
      - run: node backend/test/coverage-reliability-browser.mjs
        env:
          AUDIT_SOURCE: ${{ matrix.source }}
