name: Real provider startup browser matrix
on:
  push:
    branches: [arena/dcf86284-elfura]
    paths: [backend/test/real-startup-browser.mjs, .github/workflows/real-startup-browser.yml]
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        include:
          - {type: movie, tmdb: '693134'}
          - {type: movie, tmdb: '872585'}
          - {type: movie, tmdb: '533535'}
          - {type: movie, tmdb: '157336'}
          - {type: movie, tmdb: '1011985'}
          - {type: tv, tmdb: '95479'}
          - {type: tv, tmdb: '93405'}
          - {type: tv, tmdb: '289517'}
          - {type: tv, tmdb: '1396'}
          - {type: tv, tmdb: '114472'}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run build
      - run: npm install --no-save --no-package-lock playwright-core @sparticuz/chromium
      - run: node backend/test/real-startup-browser.mjs
        env:
          TEST_TYPE: ${{ matrix.type }}
          TEST_TMDB: ${{ matrix.tmdb }}
