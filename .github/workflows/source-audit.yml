name: Source audit
on:
  push:
    branches: [arena/d642a0e9-elfura]
    paths: [scripts/audit-sources.mjs, .github/workflows/source-audit.yml]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22, cache: npm}
      - run: npm ci
      - run: npm run build:backend
      - name: Audit
        run: |
          node scripts/audit-sources.mjs > /tmp/audit.txt 2>&1 || true
      - name: Publish
        if: always()
        run: |
          git config user.name "audit"
          git config user.email "audit@example.invalid"
          git checkout --orphan source-audit
          cp /tmp/audit.txt source-audit.txt
          git add -f source-audit.txt
          git commit -q -m "source audit"
          git push -f origin source-audit
