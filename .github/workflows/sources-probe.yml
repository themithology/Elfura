name: Sources 18-21 probe
# Live verification for the SubDubAnime / DesiDubAnime / Vidora / KMMovies lanes.
# GitHub runners reach the upstreams; the agent sandbox does not. Prints
# redacted results only and commits the report to the branch.
on:
  workflow_dispatch:
  push:
    branches: [arena/399224d8-elfura]
    paths:
      - '.github/workflows/sources-probe.yml'
      - 'scripts/newsources-probe.mjs'
      - 'backend/src/sources/source18.ts'
      - 'backend/src/sources/source19.ts'
      - 'backend/src/sources/source20.ts'
      - 'backend/src/sources/source21.ts'
      - 'backend/src/sources/media-sniff.ts'
      - 'backend/src/sources/liveness.ts'
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22, cache: npm}
      - run: npm ci
      - run: npm run build:backend
      - name: Probe the four new lanes
        run: |
          node scripts/newsources-probe.mjs 2>&1 | tee /tmp/sources-probe.log
          {
            echo '### Sources 18-21 probe'
            echo '```'
            tail -n 120 /tmp/sources-probe.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Publish probe report to this branch
        if: always()
        run: |
          mkdir -p research
          {
            echo '# Sources 18-21 live probe report'
            echo
            echo "Run: $GITHUB_RUN_ID on $GITHUB_REF_NAME at $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo
            echo '```'
            cat /tmp/sources-probe.log 2>/dev/null || echo 'probe produced no output'
            echo '```'
          } > research/sources-probe-report.md
          git config user.name 'elfura-probe'
          git config user.email 'probe@users.noreply.github.com'
          git add research/sources-probe-report.md
          git commit -m 'research: sources 18-21 live probe report [skip ci]' || exit 0
          git push origin "HEAD:$GITHUB_REF_NAME"
