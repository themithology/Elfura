name: Roxy dashboard browser test
on:
  push:
    branches: [arena/dcf86284-elfura]
    paths:
      - 'backend/src/**'
      - 'src/embed.ts'
      - 'backend/test/roxy*.mjs'
      - 'backend/test/e2e.mjs'
      - 'backend/test/selection.mjs'
      - 'backend/test/startup-budget.mjs'
      - '.github/workflows/roxy-browser.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npm run build
      - name: Run regression suite
        shell: bash
        run: |
          if npm test > /tmp/elfura-test.log 2>&1; then
            cat /tmp/elfura-test.log
          else
            tail -n 50 /tmp/elfura-test.log
            report=$(tail -n 35 /tmp/elfura-test.log | sed 's/%/%25/g' | tr '\n' ' ' | cut -c1-3000)
            echo "::error title=Regression suite::$report"
            exit 1
          fi
      - run: npm install --no-save --no-package-lock playwright-core @sparticuz/chromium
      - run: node backend/test/roxy-browser.mjs
