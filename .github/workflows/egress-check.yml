name: egress-check

# Answers one question: can a datacenter IP reach the hosts these adapters use?
# The production box reports every adapter returning zero candidates with no
# error, and provider lanes reporting timeouts, while TMDB answers normally. This
# curl matrix separates "this install's egress is blocked" from "the provider now
# refuses datacenter traffic" without touching the production server.
on:
  push:
    branches: [arena/4d781e96-elfura]
    paths:
      - '.github/workflows/egress-check.yml'
  workflow_dispatch:

jobs:
  matrix:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Reachability matrix
        run: |
          set +e
          probe() {
            local label="$1" url="$2"
            local out
            out=$(curl -sS -o /tmp/body -w '%{http_code} %{time_total}' \
              --max-time 12 -A 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36' \
              -H 'Accept: application/json,text/html;q=0.9,*/*;q=0.8' \
              "$url" 2>/tmp/err)
            local bytes; bytes=$(wc -c </tmp/body 2>/dev/null || echo 0)
            local head; head=$(head -c 70 /tmp/body 2>/dev/null | tr -d '\n\r' | tr -s ' ')
            printf '%-28s %-22s bytes=%-7s %s\n' "$label" "${out:-curl-failed}" "$bytes" "$head"
            if [ -s /tmp/err ]; then printf '%-28s ERR: %s\n' "" "$(head -c 120 /tmp/err)"; fi
          }
          echo "==== control (should work) ===="
          probe tmdb https://api.themoviedb.org/3/configuration
          echo "==== provider hosts the adapters use ===="
          probe rivestream https://www.rivestream.app/
          probe rive-scrapper https://scrapper.rivestream.app/
          probe vidbolt https://vidbolt.xyz/
          probe vidzen https://vidzen.fun/
          probe vidzee-player https://player.vidzee.wtf/
          probe vidzee-core https://core.vidzee.wtf/
          probe vixsrc https://vixsrc.to/
          probe vidsync https://vidsync.pro/
          probe vidnest https://vidnest.fun/
          probe vidnest-new https://new.vidnest.fun/
          probe moviesapi https://moviesapi.to/
          probe mapple https://mapple.fun/
          probe blakite https://blakiteapi.xyz/
          probe bingr https://bingr.one/
          probe vidout https://vidout.pages.dev/
          probe vaplayer https://streamdata.vaplayer.ru/
          probe nxsha https://nxsha.space/
          probe desidubanime https://www.desidubanime.me/
          probe cdn-jsdelivr https://cdn.jsdelivr.net/
          probe raw-github https://raw.githubusercontent.com/
          echo "==== end ===="
