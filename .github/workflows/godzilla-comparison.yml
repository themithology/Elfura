name: Godzilla baseline versus candidate
on:
  push:
    branches: [arena/dcf86284-elfura]
    paths: [backend/test/godzilla-comparison.mjs, .github/workflows/godzilla-comparison.yml]
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        mode: [baseline, candidate]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22, cache: npm}
      - run: npm ci
      - run: npm run build
      - run: npm install --no-save --no-package-lock playwright-core @sparticuz/chromium
      - run: node backend/test/godzilla-comparison.mjs
        env:
          MODE: ${{ matrix.mode }}
