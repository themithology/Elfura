name: Download page browser regression
on:
  push:
    branches: [arena/dcf86284-elfura]
    paths: [download.html, src/download.ts, src/download.css, vite.config.ts, backend/src/downloads.ts, backend/src/index.ts, backend/test/downloads.mjs, backend/test/download-browser.mjs, .github/workflows/download-browser.yml]
permissions: {contents: read}
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - run: npm ci
      - run: npm run build
      - run: node backend/test/downloads.mjs
      - run: npm install --no-save --no-package-lock playwright-core @sparticuz/chromium
      - run: node backend/test/download-browser.mjs
