name: Research local VidLink tokens
on:
  push:
    branches: [arena/124b7afe-elfura]
    paths: [backend/test/research-local-vidlink.mjs, .github/workflows/research-local-vidlink.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npm install --no-save --no-package-lock tweetnacl
      - run: npm run build:backend
      - run: node backend/test/research-local-vidlink.mjs
