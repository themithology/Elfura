name: Research TGVIDX discovery
on:
  push:
    branches: [arena/124b7afe-elfura]
    paths: [backend/test/research-tgvidx*.mjs, .github/workflows/research-tgvidx.yml]
  workflow_dispatch:
permissions: {contents: read}
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - run: npm install --no-save --no-package-lock playwright-core @sparticuz/chromium
      - run: node backend/test/research-tgvidx-decoder.mjs
      - run: node backend/test/research-tgvidx-decoded.mjs
