name: ani.zip probe
on:
  push:
    branches: [arena/d642a0e9-elfura]
    paths: [scripts/probe-anizip.mjs, .github/workflows/anizip-probe.yml]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: node scripts/probe-anizip.mjs > /tmp/out.txt 2>&1 || true
      - name: Publish
        if: always()
        run: |
          git config user.name probe
          git config user.email probe@example.invalid
          git checkout --orphan anizip-report
          cp /tmp/out.txt anizip-report.txt
          git add -f anizip-report.txt
          git commit -q -m "anizip probe"
          git push -f origin anizip-report
