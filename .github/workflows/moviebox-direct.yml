name: MovieBox direct source verification
on:
  push:
    branches: [arena/124b7afe-elfura]
    paths:
      - 'backend/src/sources/source26.ts'
      - 'backend/src/sources/registry.ts'
      - 'backend/src/sources/liveness.ts'
      - 'backend/src/sources/mp4-audio.ts'
      - 'src/core/player.ts'
      - 'src/ui/controls.ts'
      - 'backend/src/relay.ts'
      - 'backend/test/moviebox-*.mjs'
      - '.github/workflows/moviebox-direct.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22, cache: npm}
      - run: npm ci
      - run: npm run build:backend
      - run: node backend/test/moviebox-adapter.mjs
      - run: node backend/test/moviebox-dubs.mjs
      - run: node backend/test/moviebox-mp4-audio.mjs
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22, cache: npm}
      - run: npm ci
      - run: npm run build:backend
      - name: Install media probe
        id: install
        run: |
          sudo timeout 90s apt-get update -qq -o Dir::Etc::sourcelist="sources.list.d/ubuntu.sources" -o Dir::Etc::sourceparts="-"
          sudo timeout 90s apt-get install -y -qq ffmpeg
      - name: Probe movie streams
        run: node backend/test/moviebox-live.mjs movie
      - name: Verify live registry language labels
        run: node backend/test/moviebox-registry-live.mjs
      - name: Probe TV episode streams
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: node backend/test/moviebox-live.mjs tv
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22, cache: npm}
      - run: npm ci
      - run: npm run build
      - run: npm install --no-save --no-package-lock playwright-core @sparticuz/chromium @ffmpeg-installer/ffmpeg
      - run: node backend/test/moviebox-audio-browser.mjs
