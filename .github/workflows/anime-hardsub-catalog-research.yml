name: Anime hard subtitle catalogue research
on:
  push:
    branches: [arena/124b7afe-elfura]
    paths: ['backend/test/anime-hardsub-catalog-research.py', '.github/workflows/anime-hardsub-catalog-research.yml']
  workflow_dispatch:
permissions: {contents: read}
jobs:
  survey:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Install research tools
        run: |
          git clone --quiet https://github.com/aryaniiil/anime-api.git "$RUNNER_TEMP/kuhi-reference"
          git -C "$RUNNER_TEMP/kuhi-reference" checkout --quiet d9a785ad030d6fc6a8ad709291be9612c864449e
          python3 -m venv "$RUNNER_TEMP/kuhi-venv"
          "$RUNNER_TEMP/kuhi-venv/bin/pip" install --quiet --disable-pip-version-check httpx fastapi uvicorn
      - name: Inspect server groups
        run: '"$RUNNER_TEMP/kuhi-venv/bin/python" backend/test/anime-hardsub-catalog-research.py "$RUNNER_TEMP/kuhi-reference"'
      - name: Remove temporary tools
        if: always()
        run: rm -rf "$RUNNER_TEMP/kuhi-reference" "$RUNNER_TEMP/kuhi-venv"
