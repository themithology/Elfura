name: Nxsha and ScreenScape live source check

on:
  workflow_dispatch:
  push:
    branches: [arena/98a7882b-elfura]
    paths:
      - backend/src/sources/source5.ts
      - backend/src/sources/source7.ts
      - backend/test/nuvio-adapters-live.mjs
      - backend/test/live-manifest-link.mjs
      - .github/workflows/nxsha-screenscape-live.yml

permissions:
  contents: read

jobs:
  live-provider-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build:backend
      - name: Check live sources and fetchable HLS manifests
        if: github.event_name == 'push'
        run: node backend/test/nuvio-adapters-live.mjs
        env:
          ELFURA_NXSHA_ENABLED: '1'
          ELFURA_SCREENSCAPE_ENABLED: '1'
      - name: Resolve a Dune Part Two ScreenScape manifest URL
        if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[resolve-live-manifest]')
        run: node backend/test/live-manifest-link.mjs
        env:
          SOURCE: screenscape
          MEDIA_TYPE: movie
          TMDB_ID: '693134'
          OUTPUT_FILE: ${{ runner.temp }}/live-manifest.json
      - name: Upload the manifest link without exposing it in logs
        if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[resolve-live-manifest]')
        uses: actions/upload-artifact@v4
        with:
          name: live-manifest-link
          path: ${{ runner.temp }}/live-manifest.json
          retention-days: 1
          if-no-files-found: error
