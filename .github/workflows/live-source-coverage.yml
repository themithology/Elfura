name: Live source coverage matrix

on:
  push:
    branches: [arena/98a7882b-elfura]
    paths:
      - backend/src/sources/**
      - backend/src/sources/registry.ts
      - backend/test/live-sources.mjs
      - .github/workflows/live-source-coverage.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-coverage:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - name: Dune Part Two
            type: movie
            tmdb: '693134'
            season: '1'
            episode: '1'
            anilist: ''
            anilist_episode: ''
            sources: 'source-1,source-8,source-14,combined'
          - name: Dune Part Two Source 3 VidSync
            type: movie
            tmdb: '693134'
            season: '1'
            episode: '1'
            anilist: ''
            anilist_episode: ''
            sources: 'source-3,combined'
          - name: Dune Part Two Source 4 Bingr
            type: movie
            tmdb: '693134'
            season: '1'
            episode: '1'
            anilist: ''
            anilist_episode: ''
            sources: 'source-4'
          - name: Dune Part Two Source 5 Nxsha
            type: movie
            tmdb: '693134'
            season: '1'
            episode: '1'
            anilist: ''
            anilist_episode: ''
            sources: 'source-5'
          - name: Interstellar Source 7 Screenscape
            type: movie
            tmdb: '157336'
            season: '1'
            episode: '1'
            anilist: ''
            anilist_episode: ''
            sources: 'source-7'
          - name: Dune Part Two Source 9 Vixsrc
            type: movie
            tmdb: '693134'
            season: '1'
            episode: '1'
            anilist: ''
            anilist_episode: ''
            sources: 'source-9'
          - name: Interstellar Source 10 Vidnest
            type: movie
            tmdb: '157336'
            season: '1'
            episode: '1'
            anilist: ''
            anilist_episode: ''
            sources: 'source-10'
          - name: Breaking Bad S1E1 Source 11 VAPlayer
            type: tv
            tmdb: '1396'
            season: '1'
            episode: '1'
            anilist: ''
            anilist_episode: ''
            sources: 'source-11'
          - name: Jujutsu Kaisen S1E1 Source 12 Vidzen
            type: tv
            tmdb: '95479'
            season: '1'
            episode: '1'
            anilist: '113415'
            anilist_episode: '1'
            sources: 'source-12'
          - name: Interstellar Source 13 Xpass
            type: movie
            tmdb: '157336'
            season: '1'
            episode: '1'
            anilist: ''
            anilist_episode: ''
            sources: 'source-13'
          - name: Dune Part Two Source 15 Mapple
            type: movie
            tmdb: '693134'
            season: '1'
            episode: '1'
            anilist: ''
            anilist_episode: ''
            sources: 'source-15'
          - name: Jujutsu Kaisen S1E1 Source 16 Anivexa
            type: tv
            tmdb: '95479'
            season: '1'
            episode: '1'
            anilist: '113415'
            anilist_episode: '1'
            sources: 'source-16'
          - name: Interstellar Source 3 VidSync
            type: movie
            tmdb: '157336'
            season: '1'
            episode: '1'
            anilist: ''
            anilist_episode: ''
            sources: 'source-3,combined'
          - name: Breaking Bad S1E1 Source 3 VidSync
