            anilist: ''
            anilist_episode: ''
            sources: 'source-3,combined'
          - name: Spider-Man Across the Spider-Verse
            type: movie
            tmdb: '872585'
            season: '1'
            episode: '1'
            anilist: ''
            anilist_episode: ''
            sources: 'source-1,source-8,source-14,combined'
          - name: Interstellar
            type: movie
            tmdb: '157336'
            season: '1'
            episode: '1'
            anilist: ''
            anilist_episode: ''
            sources: 'source-1,source-8,source-14,combined'
          - name: Dune Part Two Source 17 Nuvio Streams
            type: movie
            tmdb: '693134'
            season: '1'
            episode: '1'
            anilist: ''
            anilist_episode: ''
            stremio_addons: '["https://nuviostreams.hayd.uk","https://nodebrid.fly.dev","https://stremify.hayd.uk","https://webstreamr.hayd.uk","https://hdhub.thevolecitor.qzz.io","https://free.flixnest.app","https://pipe.boringways.workers.dev"]'
            sources: 'source-17,combined'
          - name: Re Zero S1E1
            type: tv
            tmdb: '65942'
            season: '1'
            episode: '1'
            anilist: '21355'
            anilist_episode: '1'
            sources: 'source-1,source-8,source-14,combined'
          - name: Jujutsu Kaisen S1E1
            type: tv
            tmdb: '95479'
            season: '1'
            episode: '1'
            anilist: '113415'
            anilist_episode: '1'
            sources: 'source-1,source-8,source-14,combined'
          - name: Death Note S1E1
            type: tv
            tmdb: '13916'
            season: '1'
            episode: '1'
            anilist: '1535'
            anilist_episode: '1'
            sources: 'source-1,source-8,source-14,combined'
          - name: Frieren S1E1
            type: tv
            tmdb: '209867'
            season: '1'
            episode: '1'
            anilist: '154587'
            anilist_episode: '1'
            sources: 'source-1,source-8,source-14,combined'
          - name: Breaking Bad S1E1
            type: tv
            tmdb: '1396'
            season: '1'
            episode: '1'
            anilist: ''
            anilist_episode: ''
            sources: 'source-1,source-8,source-14,combined'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build:backend
      - name: Trace VidSync upstream API safely
        if: matrix.name == 'Dune Part Two Source 3 VidSync'
        run: node backend/test/research-vidsync.mjs
        env:
          VS_TMDB: ${{ matrix.tmdb }}
      - name: Resolve active sources and verify real manifests and media bytes
        run: node backend/test/live-sources.mjs
        env:
          NODE_ENV: production
          ELFURA_SECRET: live-source-matrix-only-not-a-production-secret
          RELAY_MODE: hybrid
          RESOLVE_TIMEOUT_MS: '20000'
          TMDB_TIMEOUT_MS: '8000'
          SOURCE1_ENABLED: '1'
          SOURCE3_ENABLED: ${{ contains(matrix.sources, 'source-3') && '1' || '0' }}
          ELFURA_BINGR_ENABLED: '1'
          ELFURA_NXSHA_ENABLED: '1'
          ELFURA_SCREENSCAPE_ENABLED: '1'
          ELFURA_VIDZEE_ENABLED: '1'
          ELFURA_VIXSRC_ENABLED: '1'
          ELFURA_VIDNEST_ENABLED: '1'
          ELFURA_VAPLAYER_ENABLED: '1'
          ELFURA_VIDZEN_ENABLED: '1'
          ELFURA_XPASS_ENABLED: '1'
          ELFURA_MAPPLE_ENABLED: '1'
          ELFURA_ANIVEXA_ENABLED: '1'
          ELFURA_RIVE_CITADEL_ENABLED: '1'
          ELFURA_STREMIO_ADDONS: ${{ matrix.stremio_addons }}
          AUDIT_TYPE: ${{ matrix.type }}
          AUDIT_TMDB: ${{ matrix.tmdb }}
          AUDIT_SEASON: ${{ matrix.season }}
          AUDIT_EPISODE: ${{ matrix.episode }}
          AUDIT_ANILIST_ID: ${{ matrix.anilist }}
          AUDIT_ANILIST_EPISODE: ${{ matrix.anilist_episode }}
          AUDIT_TITLE: ${{ matrix.name }}
          AUDIT_SOURCES: ${{ matrix.sources }}
          AUDIT_MAX_RESOLVE_MS: '18000'
          AUDIT_REQUIRE_MULTI_LANG: '0'
          AUDIT_ALLOW_UNAVAILABLE: '1'
