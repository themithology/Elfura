name: Movy access research
on:
  push:
    branches: [arena/124b7afe-elfura]
    paths: ['backend/test/fmhy-movy-access.mjs', '.github/workflows/fmhy-movy-access.yml']
  workflow_dispatch:
permissions: {contents: read}
jobs:
  access:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22, cache: npm}
      - run: npm ci
      - run: npm run build:backend
      - run: node backend/test/fmhy-movy-access.mjs
