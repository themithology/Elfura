name: Anime hard subtitle research
on:
  push:
    branches: [arena/124b7afe-elfura]
    paths: ['backend/test/anime-mikaza-hardsub-research.mjs', 'backend/test/anime-hardsub-ocr-research.py', '.github/workflows/anime-hardsub-research.yml']
  workflow_dispatch:
permissions: {contents: read}
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22, cache: npm}
      - run: npm ci
      - run: npm run build
      - run: npm install --no-save --no-package-lock playwright-core @sparticuz/chromium
      - name: Install OCR tools
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq tesseract-ocr
          python3 -m venv "$RUNNER_TEMP/ocr-venv"
          "$RUNNER_TEMP/ocr-venv/bin/pip" install --quiet --disable-pip-version-check pillow
      - name: Capture ephemeral frames with provider subtitle tracks disabled
        run: AUDIT_AUDIO_DIR="$RUNNER_TEMP/elfura-anime-frames" node backend/test/anime-mikaza-hardsub-research.mjs
      - name: Check OCR indicators without printing dialogue
        run: AUDIT_AUDIO_DIR="$RUNNER_TEMP/elfura-anime-frames" "$RUNNER_TEMP/ocr-venv/bin/python" backend/test/anime-hardsub-ocr-research.py
      - name: Delete captured frames and dependencies
        if: always()
        run: rm -rf "$RUNNER_TEMP/elfura-anime-frames" "$RUNNER_TEMP/ocr-venv"
