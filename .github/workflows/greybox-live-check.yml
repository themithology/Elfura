name: Greybox Source 25 live check
on:
  push:
    branches: [arena/124b7afe-elfura]
    paths: ['backend/test/greybox-live-check.mjs', '.github/workflows/greybox-live-check.yml']
  workflow_dispatch:
permissions: {contents: read}
jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22, cache: npm}
      - run: npm ci
      - run: npm run build
      - run: npm install --no-save --no-package-lock playwright-core @sparticuz/chromium
      - run: node backend/test/greybox-live-check.mjs
