name: Research multi-audio provider surfaces
on:
  push:
    branches: [arena/dcf86284-elfura]
    paths: [backend/test/research-multiaudio-surface.mjs, .github/workflows/research-multiaudio-surface.yml]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - run: node backend/test/research-multiaudio-surface.mjs
