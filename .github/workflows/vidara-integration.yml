name: Vidara integration browser
on:
  push:
    branches: [arena/dcf86284-elfura]
    paths: [backend/src/sources/source5.ts, backend/test/vidara-integration-browser.mjs, .github/workflows/vidara-integration.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - run: npm ci
      - run: npm run build
      - run: npm install --no-save --no-package-lock playwright-core @sparticuz/chromium
      - run: node backend/test/vidara-integration-browser.mjs
