name: Hindi anime probe
on:
  push:
    branches: [arena/d642a0e9-elfura]
    paths: [scripts/probe-hindi-anime.mjs, .github/workflows/hindi-anime-probe.yml]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22, cache: npm}
      - run: npm ci
      - run: npm run build:backend
      - run: node scripts/probe-hindi-anime.mjs > /tmp/hindi.txt 2>&1 || true
      - name: Publish
        if: always()
        run: |
          git config user.name probe
          git config user.email probe@example.invalid
          git checkout --orphan hindi-report
          cp /tmp/hindi.txt hindi-report.txt
          git add -f hindi-report.txt
          git commit -q -m "hindi anime probe"
          git push -f origin hindi-report
