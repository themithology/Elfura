name: VidSync research probe

on:
  push:
    branches:
      - arena/dcf86284-elfura
    paths:
      - backend/test/research-vidsync.mjs
      - .github/workflows/research-vidsync.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: research-vidsync
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Probe vidsync.pro backend shape
        run: node backend/test/research-vidsync.mjs
