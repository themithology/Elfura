name: Production playback audit
on:
  push:
    branches: [arena/dcf86284-elfura]
    paths: [backend/test/production-playback-audit.mjs, .github/workflows/production-playback-audit.yml]
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-save --no-package-lock playwright-core @sparticuz/chromium
      - run: node backend/test/production-playback-audit.mjs
