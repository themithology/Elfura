name: AniVortex feasibility probe
# Registers one throwaway installation and reports whether the signed routes are
# reachable from a GitHub runner. Prints redacted results only: no credentials,
# no full upstream URLs. Run manually from the Actions tab.
on:
  workflow_dispatch:
  push:
    branches: [arena/399224d8-elfura]
    paths:
      - '.github/workflows/anivortex-probe.yml'
      - 'scripts/anivortex-probe.mjs'
      - 'backend/src/anivortex-auth.ts'
      - 'backend/src/sources/source17.ts'
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22, cache: npm}
      - run: npm ci
      - run: npm run build:backend
      - name: Registration + signed catalogue/playback probe
        run: |
          node scripts/anivortex-probe.mjs \
            'movie:Dune: Part Two:2024' \
            'tv:Breaking Bad:2008:1:1' \
            'movie:Oppenheimer:2023' 2>&1 | tee /tmp/anivortex-probe.log
          {
            echo '### AniVortex probe'
            echo '```'
            cat /tmp/anivortex-probe.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Publish probe report to this branch
        # Artifact/log downloads are not always reachable from the agent sandbox,
        # so the report is committed instead of uploaded.
        run: |
          mkdir -p research
          {
            echo '# AniVortex live probe report'
            echo
            echo "Run: $GITHUB_RUN_ID on $GITHUB_REF_NAME at $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo
            echo '```'
            cat /tmp/anivortex-probe.log
            echo '```'
          } > research/anivortex-probe-report.md
          git config user.name 'elfura-probe'
          git config user.email 'probe@users.noreply.github.com'
          git add research/anivortex-probe-report.md
          git commit -m 'research: AniVortex live probe report [skip ci]' || exit 0
          git push origin "HEAD:$GITHUB_REF_NAME"
