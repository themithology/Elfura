name: Research Nuvio multi-audio HLS leads
on:
  push:
    branches: [arena/dcf86284-elfura]
    paths: [backend/test/research-nuvio-hls.mjs, .github/workflows/research-nuvio-hls.yml]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - run: node backend/test/research-nuvio-hls.mjs
