name: TG Fetcher API research
on:
  push:
    branches: [arena/dcf86284-elfura]
    paths: [research/tg-fetcher-probe.mjs, .github/workflows/tg-fetcher-research.yml]
permissions: {contents: read}
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - run: node research/tg-fetcher-probe.mjs
