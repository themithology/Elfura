name: Temporary TGVIDX browser inspection
on:
  push:
    branches: [arena/124b7afe-elfura]
    paths: [.github/workflows/temp-tgvidx-audit.yml]
permissions: {contents: read}
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - run: npm install --no-save --no-package-lock playwright-core @sparticuz/chromium
      - name: Inspect player network without recording secrets
        run: |
          cat > /tmp/tgvidx-audit.mjs <<'JS'
          import {createRequire} from 'node:module';
          const require=createRequire(process.cwd()+'/package.json');
          const {chromium}=require('playwright-core');
          const chromiumBinary=require('@sparticuz/chromium').default;
          const browser=await chromium.launch({executablePath:await chromiumBinary.executablePath(),args:[...chromiumBinary.args,'--autoplay-policy=no-user-gesture-required']});
          const page=await browser.newPage();
          const rows=[];const details=[];const pending=[];const perServer=[];let directTarget='';
          const safe = value => {try{const x=new URL(value);const found=[];for(const v of x.searchParams.values())for(const raw of [v,(()=>{try{return Buffer.from(v,'base64url').toString('utf8')}catch{return ''}})()]){try{const y=new URL(raw);if(y.hostname&&/^https?:$/.test(y.protocol))found.push({host:y.hostname,path:y.pathname.slice(0,120)})}catch{}}return {host:x.hostname,path:x.pathname.slice(0,180),queryKeys:[...x.searchParams.keys()],nested:found.slice(0,4)};}catch{return null;}};
          const isStatic = p => /\.(?:js|css|png|jpe?g|svg|webp|ico|woff2?|map)(?:$|\?)/i.test(p);
          page.on('response',r=>{
            const u=safe(r.url());if(!u || isStatic(u.path))return;
            if(u.host==='dash-hls-bridge.johndoesfmc.workers.dev'){const parsed=new URL(r.url());for(const value of parsed.searchParams.values()){try{if(new URL(value).hostname==='sacdn.hakunaymatata.com')directTarget=value;}catch{}}}
            const t=(r.headers()['content-type']||'').split(';')[0];
            const entry={...u,status:r.status(),type:t,method:r.request().method(),kind:r.request().resourceType()};rows.push(entry);
            if(/json|text\/plain|text\/x-component|mpegurl/.test(t) && !/image\.tmdb\.org/.test(u.host)){
              pending.push((async()=>{try{const text=await r.text();if(text.length>600000)return;
                const flat=text.replace(/\\\//g,'/').replace(/\\u0026/g,'&');
                const hosts=[...new Set([...flat.matchAll(/https?:\/\/([\w.-]+)(?::\d+)?/gi)].map(m=>m[1]))].slice(0,30);
                let keys=[];let sourceNames=[];
                try{const obj=JSON.parse(text);if(obj && typeof obj==='object'){keys=Object.keys(obj).slice(0,30);const walk=(x,d=0)=>{if(!x||typeof x!=='object'||d>5)return;for(const [k,v] of Object.entries(x)){if(/^(provider|server|name|label|type)$/i.test(k)&&typeof v==='string'&&v.length<=60&&!/https?:/.test(v))sourceNames.push(`${k}:${v}`);if(typeof v==='object')walk(v,d+1);}};walk(obj);}}catch{}
                const hints=[...new Set((flat.match(/greybox|orion|vidsync|vidbolt|tg\s*hub|tghub|moviebox|citadel|hindi|english|netflix|dash-hls-bridge/gi)||[]).map(s=>s.toLowerCase()))];
                const playlist=/#EXTM3U/.test(text)?{master:/#EXT-X-STREAM-INF/.test(text),audio:(text.match(/#EXT-X-MEDIA:TYPE=AUDIO/gi)||[]).length,lines:text.split('\n').filter(s=>s&&!s.startsWith('#')).slice(0,3).map(s=>safe(new URL(s,r.url()).href))}:null;
                details.push({...u,status:r.status(),bytes:text.length,keys,hosts,hints,playlist,sourceNames:[...new Set(sourceNames)].slice(0,30)});
              }catch{}})());
            }
          });
          page.on('requestfailed',r=>{const u=safe(r.url());if(u&&!isStatic(u.path))rows.push({...u,method:r.method(),failed:true,error:r.failure()?.errorText?.slice(0,100)});});
          try{
            await page.goto('https://tgvidx.lovable.app/embed/movie/1303331',{waitUntil:'domcontentloaded',timeout:30000});
            await page.waitForTimeout(18000);
            try { await page.getByRole('button',{name:'Servers',exact:true}).first().click({timeout:3000}); } catch {}
            await page.waitForTimeout(1000);
            const names=await page.evaluate(()=>[...document.querySelectorAll('button')].map(b=>(b.innerText||'').split('\n')[0].trim()).filter(s=>/^TG (?:GREY|STREAMHG)/.test(s)));
            for(const name of names.slice(0,7)){
              try {
                const button=page.getByRole('button',{name,exact:false}).first();
                if(!await button.isVisible()) await page.getByRole('button',{name:'Servers',exact:true}).first().click({timeout:3000});
                const start=rows.length;
                await button.click({timeout:3000});
                await page.waitForTimeout(7000);
                const net=rows.slice(start).filter(x=>!x.host.endsWith('lovable.app')&&!x.host.endsWith('googleapis.com'));
                const unique=[...new Map(net.map(x=>[`${x.host}${x.path}:${x.status}:${x.failed}`,x])).values()].slice(0,10);
                const video=await page.evaluate(()=>{const v=document.querySelector('video');return v?{ready:v.readyState,time:v.currentTime,width:v.videoWidth}:null});
                perServer.push({name,network:unique,video});
              }catch(e){perServer.push({name,error:e.name});}
            }
            try { const b=page.getByRole('button',{name:'Servers',exact:true}).first();if(await b.isVisible())await b.click({timeout:3000}); }catch{}
            await page.waitForTimeout(1000);
            const ui=await page.evaluate(()=>({text:document.body?.innerText?.slice(0,2000),videos:[...document.querySelectorAll('video')].map(v=>({ready:v.readyState,time:v.currentTime,width:v.videoWidth,paused:v.paused})),buttons:[...document.querySelectorAll('button')].map(b=>({label:(b.innerText||b.getAttribute('aria-label')||b.title||'').slice(0,90)})).filter(x=>x.label).slice(0,35)}));
            await Promise.allSettled(pending);
            const uniq=[...new Map(rows.map(x=>[`${x.host}${x.path}:${x.status}:${x.failed}`,x])).values()].slice(0,80);
            const direct=[];
            if(directTarget) for(const [label,headers] of [['plain',{}],['greybox',{Referer:'https://greyboxtv.duckdns.org/',Origin:'https://greyboxtv.duckdns.org'}]]){
              try{const r=await fetch(directTarget,{headers,redirect:'manual',signal:AbortSignal.timeout(6000)});const ct=r.headers.get('content-type');let manifest=false;if(r.ok){const reader=r.body?.getReader();const x=await reader?.read();manifest=x?.value?Buffer.from(x.value).toString('utf8').includes('#EXTM3U'):false;await reader?.cancel();}else await r.body?.cancel();direct.push({label,status:r.status,contentType:ct,manifest});}catch(e){direct.push({label,error:e.name,cause:e.cause?.code});}
            }
            console.log('::notice title=TGVIDX CDN direct::'+JSON.stringify(direct).replace(/%/g,'%25'));
            console.log('::notice title=TGVIDX UI::'+JSON.stringify(ui).replace(/%/g,'%25').replace(/\n/g,'%0A'));
            console.log('::notice title=TGVIDX summary::'+JSON.stringify({count:rows.length,hosts:[...new Set(rows.map(x=>x.host))],media:rows.filter(x=>/m3u8|mpd|\.mp4|video\//i.test(x.path+' '+x.type)).slice(0,10)}).replace(/%/g,'%25'));
            for(let i=0;i<perServer.length;i+=2) console.log(`::notice title=TGVIDX chosen servers::${JSON.stringify(perServer.slice(i,i+2)).replace(/%/g,'%25')}`);
            for(let i=0;i<Math.min(uniq.length,20);i+=10) console.log(`::notice title=TGVIDX requests::${JSON.stringify(uniq.slice(i,i+10)).replace(/%/g,'%25')}`);
            for(let i=0;i<Math.min(details.length,4);i+=4)console.log(`::notice title=TGVIDX responses::${JSON.stringify(details.slice(i,i+4)).replace(/%/g,'%25')}`);
          } finally {await browser.close();}
          JS
          node /tmp/tgvidx-audit.mjs > /tmp/tgvidx-result 2>&1 || { tail -8 /tmp/tgvidx-result | sed -E 's#https?://[^ ]+#[url]#g' | while IFS= read -r line; do echo "::error::$line"; done; exit 1; }
          cat /tmp/tgvidx-result
