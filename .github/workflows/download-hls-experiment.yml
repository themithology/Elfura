name: HLS download experiment
on:
  push:
    branches: ['arena/dcf86284-elfura']
    paths: ['backend/src/download-hls.ts', 'backend/src/download-converter.ts', 'backend/test/download-hls-*.mjs', '.github/workflows/download-hls-experiment.yml']
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - run: npm ci
      - run: npm run build
      - name: Get test-only FFmpeg
        run: |
          npm pack @backendsuraj/offline-ffmpeg-linux-x64@8.0.2 --pack-destination /tmp
          mkdir -p /tmp/elfura-ffmpeg
          tar -xzf /tmp/backendsuraj-offline-ffmpeg-linux-x64-8.0.2.tgz -C /tmp/elfura-ffmpeg
          chmod +x /tmp/elfura-ffmpeg/package/bin/ffmpeg
          echo "ELFURA_TEST_FFMPEG=/tmp/elfura-ffmpeg/package/bin/ffmpeg" >> "$GITHUB_ENV"
          echo "ELFURA_FFMPEG_PATH=/tmp/elfura-ffmpeg/package/bin/ffmpeg" >> "$GITHUB_ENV"
      - run: node backend/test/download-hls-parser.mjs && node backend/test/download-hls-integration.mjs
      - name: Bounded live source observation
        run: node backend/test/download-hls-live.mjs
