name: Resolve one live HLS manifest

on:
  push:
    branches: [arena/98a7882b-elfura]
    paths:
      - .github/workflows/resolve-live-manifest.yml
      - backend/test/live-manifest-link.mjs
  workflow_dispatch:
    inputs:
      source:
        description: Source to query
        type: choice
        options: [nxsha, screenscape]
        default: screenscape
        required: true
      media_type:
        description: Movie or TV episode
        type: choice
        options: [movie, tv]
        default: movie
        required: true
      tmdb_id:
        description: Numeric TMDB ID (default is Dune Part Two)
        type: string
        default: '693134'
        required: true
      season:
        description: TV season (ignored for movies)
        type: string
        default: '1'
        required: true
      episode:
        description: TV episode (ignored for movies)
        type: string
        default: '1'
        required: true

permissions:
  contents: read

jobs:
  resolve-one:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build:backend
      - name: Resolve a manifest-reachable URL
        run: node backend/test/live-manifest-link.mjs
        env:
          SOURCE: ${{ inputs.source }}
          MEDIA_TYPE: ${{ inputs.media_type }}
          TMDB_ID: ${{ inputs.tmdb_id }}
          SEASON: ${{ inputs.season }}
          EPISODE: ${{ inputs.episode }}
          OUTPUT_FILE: ${{ runner.temp }}/live-manifest.json
      - uses: actions/upload-artifact@v4
        with:
          name: live-manifest-link
          path: ${{ runner.temp }}/live-manifest.json
          retention-days: 1
          if-no-files-found: error
