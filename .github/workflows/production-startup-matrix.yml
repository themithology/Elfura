name: Production measured startup matrix
on:
  workflow_dispatch:
  push:
    branches: [arena/dcf86284-elfura]
    paths: [backend/test/production-startup-matrix.mjs, .github/workflows/production-startup-matrix.yml]
permissions:
  contents: read
jobs:
  playback:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - {type: movie, tmdb: '807'}
          - {type: movie, tmdb: '693134'}
          - {type: movie, tmdb: '872585'}
          - {type: movie, tmdb: '533535'}
          - {type: movie, tmdb: '157336'}
          - {type: tv, tmdb: '95479'}
          - {type: tv, tmdb: '93405'}
          - {type: tv, tmdb: '289517'}
          - {type: tv, tmdb: '1396'}
          - {type: tv, tmdb: '215072', season: '2', episode: '2'}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - run: npm install --no-save --no-package-lock playwright-core @sparticuz/chromium
      - run: node backend/test/production-startup-matrix.mjs
        env:
          TEST_TYPE: ${{ matrix.type }}
          TEST_TMDB: ${{ matrix.tmdb }}
          TEST_SEASON: ${{ matrix.season }}
          TEST_EPISODE: ${{ matrix.episode }}
