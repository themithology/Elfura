name: Direct multilingual source 27
on:
  push:
    branches: [arena/124b7afe-elfura]
    paths:
      - 'backend/src/sources/source27.ts'
      - 'backend/src/sources/registry.ts'
      - 'backend/test/source27*.mjs'
      - '.github/workflows/source27.yml'
  workflow_dispatch:
permissions: {contents: read}
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22, cache: npm}
      - run: npm ci
      - run: npm run build
      - run: node backend/test/source27.mjs
      - run: npm install --no-save --no-package-lock playwright-core @sparticuz/chromium
      - run: node backend/test/source27-real-browser.mjs
