name: Source player diagnostic
on:
  push:
    branches: [arena/124b7afe-elfura]
    paths: ['backend/test/source4-player-diagnostic.mjs', '.github/workflows/source4-player-diagnostic.yml']
  workflow_dispatch:
permissions: {contents: read}
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        source: [source-1, source-4]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22, cache: npm}
      - run: npm ci
      - run: npm run build
      - run: npm install --no-save --no-package-lock playwright-core @sparticuz/chromium
      - run: node backend/test/source4-player-diagnostic.mjs
        env:
          AUDIT_SOURCE: ${{ matrix.source }}
          AUDIT_SHORT: '1'
