name: Live playback startup audit
on:
  push:
    branches: [arena/dcf86284-elfura]
    paths: [backend/test/research-startup.mjs, .github/workflows/research-startup.yml, backend/src/sources/registry.ts, backend/src/sources/source1.ts, backend/src/sources/liveness.ts, backend/src/sources/selection.ts]
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npm run build:backend
      - run: node backend/test/research-startup.mjs
