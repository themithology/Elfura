name: Startup deadline browser regression
on:
  push:
    branches: [arena/dcf86284-elfura]
    paths: [src/core/player.ts, src/ui/controls.ts, backend/test/startup-deadline-browser.mjs, .github/workflows/startup-deadline-browser.yml]
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22, cache: npm}
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npm install --no-save --no-package-lock playwright-core @sparticuz/chromium @ffmpeg-installer/ffmpeg
      - run: node backend/test/startup-deadline-browser.mjs
