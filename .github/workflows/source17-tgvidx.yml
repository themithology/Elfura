name: TGVIDX adapter and browser
on:
  push:
    branches: [arena/124b7afe-elfura]
    paths: [backend/src/sources/source17.ts, backend/test/source17-tgvidx.mjs, backend/test/source17-real-browser.mjs, backend/test/source17-rezero-browser.mjs, .github/workflows/source17-tgvidx.yml]
  workflow_dispatch:
permissions: {contents: read}
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22, cache: npm}
      - run: npm ci
      - run: npm run build
      - run: node backend/test/source17-tgvidx.mjs && node backend/test/source17-late-deadline.mjs && ELFURA_RAM_CACHE=off node backend/test/source17-late-deadline.mjs && node --experimental-strip-types backend/test/source17-codecs.mjs
      - run: npm install --no-save --no-package-lock playwright-core @sparticuz/chromium
      - run: node backend/test/source17-real-browser.mjs
      - run: node backend/test/source17-rezero-browser.mjs
