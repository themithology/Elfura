name: Anime Japanese English playback research
on:
  push:
    branches: [arena/124b7afe-elfura]
    paths: ['backend/test/anime-ja-en-real-browser.mjs', 'backend/test/anime-audio-language-research.py', '.github/workflows/anime-ja-en-browser.yml']
  workflow_dispatch:
permissions: {contents: read}
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      AUDIT_AUDIO_DIR: ${{ runner.temp }}/elfura-anime-audio
      HF_HOME: ${{ runner.temp }}/elfura-audio-model
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22, cache: npm}
      - run: npm ci
      - run: npm run build
      - run: npm install --no-save --no-package-lock playwright-core @sparticuz/chromium
      - run: node backend/test/anime-ja-en-real-browser.mjs
      - name: Approximate spoken-language check (optional)
        run: |
          if python3 -m venv "$RUNNER_TEMP/anime-audio-venv" && "$RUNNER_TEMP/anime-audio-venv/bin/pip" install --quiet --disable-pip-version-check faster-whisper; then
            "$RUNNER_TEMP/anime-audio-venv/bin/python" backend/test/anime-audio-language-research.py
          else
            echo '::notice title=Automatic audio language research::Dependency installation unavailable'
          fi
      - name: Remove temporary research clips and model
        if: always()
        run: rm -rf "$AUDIT_AUDIO_DIR" "$HF_HOME" "$RUNNER_TEMP/anime-audio-venv"
