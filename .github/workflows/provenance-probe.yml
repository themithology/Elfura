name: Provenance + source 14/12 expansion probe
on:
  workflow_dispatch:
  push:
    branches: [arena/399224d8-elfura]
    paths:
      - '.github/workflows/provenance-probe.yml'
      - 'scripts/provenance-probe.mjs'
      - 'backend/src/sources/source12.ts'
      - 'backend/src/sources/source14.ts'
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22, cache: npm}
      - run: npm ci
      - run: npm run build:backend
      - name: Probe
        run: |
          node scripts/provenance-probe.mjs 2>&1 | tee /tmp/provenance.log
          {
            echo '### Provenance probe'
            echo '```'
            tail -n 200 /tmp/provenance.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Publish report
        if: always()
        run: |
          mkdir -p research
          {
            echo '# Provenance + Sources 14/12 expansion report'
            echo
            echo "Run: $GITHUB_RUN_ID on $GITHUB_REF_NAME at $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo
            echo '```'
            cat /tmp/provenance.log 2>/dev/null || echo 'no output'
            echo '```'
          } > research/provenance-report.md
          git config user.name 'elfura-probe'
          git config user.email 'probe@users.noreply.github.com'
          git add research/provenance-report.md
          git commit -m 'research: provenance + sources 14/12 probe [skip ci]' || exit 0
          git push origin "HEAD:$GITHUB_REF_NAME"
