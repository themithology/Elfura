name: source contract

# The admission gate, run where it can actually reach the providers.
#
# The sandbox that edits this code has no usable egress, so a lane can only be
# proven on a runner (a datacenter IP, the same as a player host). If this job
# is red, the board contains a source that does not produce bytes — remove it
# from APPROVED_SOURCES or fix the adapter; do not merge around it.
on:
  workflow_dispatch:
  schedule:
    - cron: '15 4 * * *'
  push:
    paths:
      - 'backend/src/sources/**'
      - 'backend/test/source-contract.mjs'
      - '.github/workflows/source-contract.yml'

# The verdict is committed back to the branch, which needs a write token.
permissions:
  contents: write

jobs:
  contract:
    name: every approved source produces bytes
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci --no-audit --no-fund
      - run: npm run build:backend
      # The verdict is written to a file, not just to the log: log download from
      # the sandbox that reads this repo fails with EOF, so the only way to see
      # what the gate decided is to commit it.
      - name: Contract
        id: contract
        continue-on-error: true
        run: |
          set -o pipefail
          node backend/test/source-contract.mjs 2>&1 | tee research/contract-last.txt
        env:
          NODE_ENV: production
          ELFURA_SECRET: contract-test-only-not-a-production-secret
          RESOLVE_TIMEOUT_MS: '20000'
          TMDB_TIMEOUT_MS: '8000'

      - name: Record the verdict on the branch
        if: always()
        run: |
          git config user.name "source contract"
          git config user.email "contract@example.invalid"
          git add research/contract-last.txt
          git diff --cached --quiet || git commit -m "Source contract verdict for $(git rev-parse --short HEAD)"
          git push

      - name: Enforce the verdict
        if: steps.contract.outcome == 'failure'
        run: |
          echo "The gate is red; the verdict above is committed to research/contract-last.txt."
          exit 1

      # The contract proves bytes flow; this proves the board reasons about them.
      - name: Size ranking, live
        id: ranking
        continue-on-error: true
        run: |
          set -o pipefail
          node backend/test/citadel-live.mjs 2>&1 | tee research/ranking-last.txt
        env:
          NODE_ENV: production
          ELFURA_SECRET: contract-test-only-not-a-production-secret
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}

      - name: Record the ranking verdict
        if: always()
        run: |
          git config user.name "source contract"
          git config user.email "contract@example.invalid"
          git add research/ranking-last.txt
          git diff --cached --quiet || git commit -m "Size ranking verdict for $(git rev-parse --short HEAD)"
          git push

      - name: Enforce the ranking verdict
        if: steps.ranking.outcome == 'failure'
        run: |
          echo "Size ranking is red; see research/ranking-last.txt."
          exit 1
