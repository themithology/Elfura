name: Research ZXC ten-title Hindi check
on:
  push:
    branches: [arena/dcf86284-elfura]
    paths: [backend/test/research-zxc-hindi-ten.mjs, .github/workflows/research-zxc-hindi-ten.yml]
permissions:
  contents: read
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node backend/test/research-zxc-hindi-ten.mjs
