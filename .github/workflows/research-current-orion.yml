name: Research current direct Orion
on:
  push:
    branches: [arena/124b7afe-elfura]
    paths: [.github/workflows/research-current-orion.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --no-package-lock @ffmpeg-installer/ffmpeg
      - run: node backend/test/research-vidbolt-direct.mjs
