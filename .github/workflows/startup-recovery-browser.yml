name: Startup recovery browser regression
on:
  push:
    branches: [arena/dcf86284-elfura]
    paths: [src/core/player.ts, backend/test/startup-recovery-browser.mjs, .github/workflows/startup-recovery-browser.yml]
permissions:
  contents: read
jobs:
  recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        mode: [recover, unavailable]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run build
      - run: npm install --no-save --no-package-lock playwright-core @sparticuz/chromium
      - run: node backend/test/startup-recovery-browser.mjs
        env:
          RECOVERY_MODE: ${{ matrix.mode }}
