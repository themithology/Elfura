name: Vidara research
on:
  push:
    branches: [arena/dcf86284-elfura]
    paths: [backend/test/research-vidara.mjs, backend/test/vidara-browser-research.mjs, .github/workflows/research-vidara.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - run: node backend/test/research-vidara.mjs
      - run: npm ci
      - run: npm run build:lib
      - run: npm install --no-save --no-package-lock playwright-core @sparticuz/chromium
      - run: node backend/test/vidara-browser-research.mjs
