name: diagnose-compare

# Runs the exact probe behind /diagnose on a GitHub runner, so the answer to
# "why are the sources not working?" can be split into two different questions:
#
#   runner: 0/20 answered  -> the adapters are broken (a code problem)
#   runner: 20/20 answered -> this host is refused (a network problem)
#   runner: some answered  -> per-provider refusal, and the lane details say which
#
# Nothing here touches the production server. It builds this commit and resolves
# one title from a datacenter IP, which is what a player host looks like.
on:
  # workflow_dispatch only registers once this file is on the default branch, so a
  # PR touching the comparison tooling is how it gets exercised before that.
  pull_request:
    paths:
      - 'scripts/diagnose-compare.mjs'
      - '.github/workflows/diagnose-compare.yml'
  workflow_dispatch:
    inputs:
      type:
        description: 'movie or tv'
        default: movie
      tmdb:
        description: 'TMDB id (550 = Fight Club)'
        default: '550'
      season:
        description: 'season (tv only)'
        default: ''
      episode:
        description: 'episode (tv only)'
        default: ''

permissions:
  contents: write

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build

      - name: Probe the same title the server probed
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          TMDB_BEARER_TOKEN: ${{ secrets.TMDB_BEARER_TOKEN }}
          ELFURA_SECRET: ci-diagnose-compare
          ELFURA_SELF_TEST: '0'
        run: |
          node scripts/diagnose-compare.mjs \
            "${{ github.event.inputs.type || 'movie' }}" \
            "${{ github.event.inputs.tmdb || '550' }}" \
            "${{ github.event.inputs.season }}" \
            "${{ github.event.inputs.episode }}" | tee /tmp/compare.txt

      # The two upstreams whose API shapes cannot be probed from a build sandbox
      # (both gate on request headers, which a header-less fetch cannot send).
      # Runs on the runner's real IP, so its answer is evidence.
      - name: Probe vidbolt and vidsync directly
        if: always()
        continue-on-error: true
        run: |
          node scripts/probe-vidbolt-vidsync.mjs 2>&1 | tee -a /tmp/compare.txt || true
          node scripts/probe-tgfrost.mjs 2>&1 | tee -a /tmp/compare.txt || true

      # A real browser, because TG FROST resolves server-side: only the wire
      # shows which backends actually answer. Deps are not saved to the lockfile.
      - name: Watch the TG FROST player's network
        if: always()
        continue-on-error: true
        run: |
          npm install --no-save --no-package-lock playwright-core @sparticuz/chromium >/dev/null 2>&1 || true
          node scripts/probe-tgfrost-browser.mjs 2>&1 | tee -a /tmp/compare.txt || true
          node scripts/probe-browser-lane.mjs 2>&1 | tee -a /tmp/compare.txt || true
          node scripts/probe-tgfrost-servers.mjs 2>&1 | tee -a /tmp/compare.txt || true

      - name: Write a summary
        if: always()
        run: |
          {
            echo "## diagnose-compare (CI runner)"
            echo ""
            echo "Same registry, same adapters, same verification as \`/diagnose\` — different host."
            echo ""
            echo '```'
            sed -n '/\[diagnose-compare\]/,/\[diagnose-compare:json\]/p' /tmp/compare.txt | head -40
            echo '```'
            echo ""
            echo "Compare the **raw / kept / reach** columns against your server's"
            echo "\`/diagnose\` JSON for the same title. A source with raw>0 here and"
            echo "raw=0 there is refused on your host, not broken in code."
          } >> "$GITHUB_STEP_SUMMARY"

      # The artifact is uploaded for humans, but the Actions log and artifact
      # blobs live on a host that some networks cannot reach (which is how this
      # whole comparison came about in the first place). Committing the report to
      # an orphan branch means the answer is always readable from the repository
      # itself, with no special access:  git show ci-diagnose:latest.txt
      # Needs `permissions: contents: write`, which the repository's default
      # workflow token does not have. Declared here so it works without a repo
      # settings change; if the organization still refuses, the step says so in
      # the log instead of pretending it published something.
      - name: Publish the report to the ci-diagnose branch
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ ! -s /tmp/compare.txt ]; then echo 'no report produced'; exit 0; fi
          cp /tmp/compare.txt /tmp/latest.txt
          git config user.name  'diagnose-compare'
          git config user.email 'diagnose-compare@users.noreply.github.com'
          # A fresh orphan branch each run: no history to grow, no merge conflicts.
          git checkout --orphan ci-diagnose-tmp
          git rm -r --cached . >/dev/null 2>&1 || true
          cp /tmp/latest.txt ./latest.txt
          printf 'run %s\ncommit %s\ntitle %s/%s\n\n' \
            "${{ github.run_id }}" "${{ github.sha }}" \
            "${{ github.event.inputs.type || 'movie' }}" \
            "${{ github.event.inputs.tmdb || '550' }}" > header.txt
          cat header.txt latest.txt > ci-diagnose.txt
          git add -f ci-diagnose.txt
          git commit -m "diagnose-compare run ${{ github.run_id }}"
          if git push --force origin HEAD:ci-diagnose; then
            echo "published to branch ci-diagnose"
          else
            echo "::warning::could not push ci-diagnose (workflow token is read-only here); the artifact still has the report"
          fi

      - name: Keep the raw report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diagnose-compare-${{ github.run_id }}
          path: /tmp/compare.txt
          retention-days: 14
