name: OFC provider research
on:
  push:
    branches: [arena/dcf86284-elfura]
    paths: [backend/test/research-ofc.mjs, .github/workflows/research-ofc.yml]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - {id: '317614306860908496', params: ''}
          - {id: '3704680669235267152', params: ''}
          - {id: '7284707862688189216', params: '&se=1&ep=1'}
          - {id: '572586342836831120', params: '&se=1&ep=1'}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-save --no-package-lock playwright-core @sparticuz/chromium @ffprobe-installer/ffprobe
      - run: node backend/test/research-ofc.mjs
        env:
          OFC_ID: ${{ matrix.id }}
          OFC_PARAMS: ${{ matrix.params }}
