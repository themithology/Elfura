name: Nuvio download source research
on:
  push:
    branches: [arena/dcf86284-elfura]
    paths: [research/download-hdhub-probe.cjs, .github/workflows/download-nuvio-research.yml]
permissions: {contents: read}
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    strategy:
      fail-fast: false
      matrix:
        include:
          - {title: 'Godzilla Minus One', year: '2023', tmdb: '940721'}
          - {title: 'Jawan', year: '2023', tmdb: '872585'}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - run: git clone --depth 1 https://github.com/tapframe/NuvioStreamsAddon.git /tmp/nuvio-research
      - run: cd /tmp/nuvio-research && npm install --no-save --ignore-scripts --no-package-lock axios cheerio string-similarity ioredis redis
        env: {PUPPETEER_SKIP_DOWNLOAD: 'true'}
      - run: node research/download-hdhub-probe.cjs
        env:
          TITLE: ${{ matrix.title }}
          YEAR: ${{ matrix.year }}
          TMDB: ${{ matrix.tmdb }}
