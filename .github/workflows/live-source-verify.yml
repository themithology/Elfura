name: Live verification of the four approved sources

# Real-network acceptance runs on GitHub Actions, never in the restricted agent
# sandbox. Each job uses a title measured for the adapters under test and verifies
# actual manifest/segment bytes through the production stream relay. Candidate
# counts alone are not a playback check; this also exercises Vidly's restricted
# media-origin transport.

on:
  workflow_dispatch:
  push:
    paths:
      - 'backend/src/sources/**'
      - 'backend/src/restricted-fetch.ts'
      - 'backend/src/sources/registry.ts'
      - 'backend/src/relay.ts'
      - 'backend/src/security.ts'
      - 'backend/test/live-sources.mjs'
      - '.github/workflows/live-source-verify.yml'

permissions:
  contents: read

jobs:
  verify:
    name: verify (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: fight-club-movie-all-four
            type: movie
            tmdb: '550'
            season: '1'
            episode: '1'
            title: 'Fight Club'
            sources: 'source-1,source-2,source-3,source-4,combined'
          - name: game-of-thrones-s1e1-all-four
            type: tv
            tmdb: '1399'
            season: '1'
            episode: '1'
            title: 'Game of Thrones S1E1'
            sources: 'source-1,source-2,source-3,source-4,combined'
          - name: naruto-s1e1-nxsha-and-combined
            type: tv
            tmdb: '46260'
            season: '1'
            episode: '1'
            title: 'Naruto S1E1'
            sources: 'source-3,combined'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build:backend
      - name: Verify real media bytes through the relay
        run: node backend/test/live-sources.mjs
        env:
          NODE_ENV: production
          ELFURA_SECRET: live-audit-only-not-a-production-secret
          RELAY_MODE: hybrid
          RESOLVE_TIMEOUT_MS: '9000'
          TMDB_TIMEOUT_MS: '8000'
          AUDIT_TYPE: ${{ matrix.type }}
          AUDIT_TMDB: ${{ matrix.tmdb }}
          AUDIT_SEASON: ${{ matrix.season }}
          AUDIT_EPISODE: ${{ matrix.episode }}
          AUDIT_TITLE: ${{ matrix.title }}
          AUDIT_SOURCES: ${{ matrix.sources }}
          AUDIT_MAX_RESOLVE_MS: '9000'
          AUDIT_REQUIRE_MULTI_LANG: '0'
