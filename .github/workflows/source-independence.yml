name: source independence

# Answers one question per candidate: is this a NEW source, or a third name for
# a pipe already on the board?
#
# It exists because greybox and vidora both played and both resolved through
# hakunaymatata CDNs and workers.dev bridges — two names, one upstream. Measuring
# playability alone could never have told us that.
#
# The probe follows each candidate's playlists one hop (a relay hides its true
# CDN one level down), collects every host involved, and compares them against
# the hosts behind the approved sources. It never registers anything.
#
# Runs on a runner because the editing sandbox answers ECONNRESET from every
# provider host.
on:
  workflow_dispatch:
  push:
    branches: [arena/38aa0193-elfura]
    paths:
      - 'scripts/research/independence.mjs'
      - 'scripts/research/object-overlap.mjs'
      - 'scripts/research/nxsha-probe.mjs'
      - 'scripts/research/nxsha-lanes.mjs'
      - 'scripts/research/anivortex-426.mjs'
      - 'scripts/research/upstream-lookup.mjs'
      - 'scripts/research/vidly-deep.mjs'
      - 'scripts/research/vidly-streams.mjs'
      - 'scripts/research/vidly-stream-bytes.mjs'
      - 'scripts/research/vidly-page-lang.mjs'
      - 'scripts/research/nxsha-row-fields.mjs'
      - 'scripts/research/nxsha-row-liveness.mjs'
      - 'scripts/research/nxsha-breaking-bad.mjs'
      - 'scripts/research/nxsha-castle-headers.mjs'
      - 'scripts/research/nxsha-all-lanes.mjs'
      - 'scripts/research/nxsha-castle-proof.mjs'
      - 'scripts/research/nxsha-hindi-verify.mjs'
      - 'scripts/research/stremio-addon-survey.mjs'
      - '.github/workflows/source-independence.yml'

# The verdict is committed back to the branch; logs cannot be downloaded from
# the sandbox that reads this repo.
permissions:
  contents: write

concurrency:
  group: source-independence-${{ github.ref }}
  cancel-in-progress: true

jobs:
  probe:
    name: does the candidate share its media hosts with the board
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci --no-audit --no-fund

      - run: npm run build:backend

      - name: Probe
        continue-on-error: true
        run: |
          set -o pipefail
          node scripts/research/independence.mjs 2>&1 | tee research/independence-last.txt
        env:
          NODE_OPTIONS: --dns-result-order=ipv4first

      # What does an upstream actually carry? The board keeps no catalogue, so
      # this asks the one index that answers without a session.
      - name: Look up vidly and bingr
        continue-on-error: true
        run: |
          set -o pipefail
          node scripts/research/upstream-lookup.mjs 2>&1 | tee research/upstream-lookup-last.txt
        env:
          NODE_OPTIONS: --dns-result-order=ipv4first

      # The product question: does the Hindi on this board actually play Hindi,
      # or is it only a word in a provider's label?
      - name: Prove nxsha castle plays
        continue-on-error: true
        run: |
          set -o pipefail
          node scripts/research/nxsha-castle-proof.mjs 2>&1 | tee research/nxsha-castle-proof-last.txt
        env:
          NODE_OPTIONS: --dns-result-order=ipv4first

      # The board treated 22 lanes as dead on a 2-title sample. Ask all 30 against
      # Indian-weighted titles, and all six RiveStream providers, not just citadel.
      - name: Survey Stremio addons for direct streams
        continue-on-error: true
        run: |
          node scripts/research/stremio-addon-survey.mjs 2>&1 | tee research/stremio-addon-survey-last.txt

      - name: Survey all lanes of both multi-lane sources
        continue-on-error: true
        run: |
          set -o pipefail
          node scripts/research/nxsha-all-lanes.mjs 2>&1 | tee research/nxsha-all-lanes-last.txt
        env:
          NODE_OPTIONS: --dns-result-order=ipv4first

      # castle answered 403 bare and 200 with four headers at once. Isolate which.
      - name: Verify nxsha Hindi rows
        continue-on-error: true
        run: |
          set -o pipefail
          node scripts/research/nxsha-hindi-verify.mjs 2>&1 | tee research/nxsha-hindi-verify-last.txt
        env:
          NODE_OPTIONS: --dns-result-order=ipv4first

      # castle served a 70 KB playlist with one extra header. Prove it plays.
      - name: Isolate nxsha castle headers
        continue-on-error: true
        run: |
          set -o pipefail
          node scripts/research/nxsha-castle-headers.mjs 2>&1 | tee research/nxsha-castle-headers-last.txt
        env:
          NODE_OPTIONS: --dns-result-order=ipv4first

      # The owner's question, on the title they named: is any row labelled Hindi
      # actually Hindi, and are the "dead" rows dead or just expiring/bot-gated?
      - name: Probe nxsha Breaking Bad S1E1
        continue-on-error: true
        run: |
          set -o pipefail
          node scripts/research/nxsha-breaking-bad.mjs 2>&1 | tee research/nxsha-breaking-bad-last.txt
        env:
          NODE_OPTIONS: --dns-result-order=ipv4first

      # After the language rule, one awsind row carries movie/550 for source-3
      # and its manifest 502'd through the board's proxy. Find out which side died.
      - name: Test nxsha row liveness
        continue-on-error: true
        run: |
          set -o pipefail
          node scripts/research/nxsha-row-liveness.mjs 2>&1 | tee research/nxsha-row-liveness-last.txt
        env:
          NODE_OPTIONS: --dns-result-order=ipv4first

      # source-3 went to 0 candidates the moment a rule depended on row.language.
      # Either the rows are unlabelled or that is not the field. Dump every field.
      - name: Dump nxsha row fields
        continue-on-error: true
        run: |
          set -o pipefail
          node scripts/research/nxsha-row-fields.mjs 2>&1 | tee research/nxsha-row-fields-last.txt
        env:
          NODE_OPTIONS: --dns-result-order=ipv4first

      # The board-live test requires language evidence. Measure what the page
      # actually carries before writing an extractor for it.
      - name: Measure vidly page language evidence
        continue-on-error: true
        run: |
          set -o pipefail
          node scripts/research/vidly-page-lang.mjs 2>&1 | tee research/vidly-page-lang-last.txt
        env:
          NODE_OPTIONS: --dns-result-order=ipv4first

      # A real media URL was found in the page with no token. Prove it plays, or
      # find out that it does not, before anyone builds on it.
      - name: Prove vidly stream bytes
        continue-on-error: true
        run: |
          set -o pipefail
          node scripts/research/vidly-stream-bytes.mjs 2>&1 | tee research/vidly-stream-bytes-last.txt
        env:
          NODE_OPTIONS: --dns-result-order=ipv4first

      # Nobody has ever measured vidly's STREAMS - only its subtitles. This is
      # the part that decides whether it is a source.
      - name: Probe vidly streams
        continue-on-error: true
        run: |
          set -o pipefail
          node scripts/research/vidly-streams.mjs 2>&1 | tee research/vidly-streams-last.txt
        env:
          NODE_OPTIONS: --dns-result-order=ipv4first

      # Does vidly carry Hindi under a name the first pass did not read? Its rows
      # have label and group fields, and only `lang` was examined.
      - name: Probe vidly in depth
        continue-on-error: true
        run: |
          set -o pipefail
          node scripts/research/vidly-deep.mjs 2>&1 | tee research/vidly-deep-last.txt
        env:
          NODE_OPTIONS: --dns-result-order=ipv4first

      # The anivortex audit says TV is blocked. Its own probe output shows six
      # reachable rows on a different host family. Find out which is true.
      - name: Re-test anivortex TV
        continue-on-error: true
        run: |
          set -o pipefail
          node scripts/research/anivortex-426.mjs 2>&1 | tee research/anivortex-426-last.txt
        env:
          NODE_OPTIONS: --dns-result-order=ipv4first

      # nxsha was rejected on /watch HTML pages, which is the website, not the API
      # its adapter calls. Re-test the endpoints that actually serve data.
      - name: Probe nxsha on its real API
        continue-on-error: true
        run: |
          set -o pipefail
          node scripts/research/nxsha-probe.mjs 2>&1 | tee research/nxsha-probe-last.txt
        env:
          NODE_OPTIONS: --dns-result-order=ipv4first

      # Every one of its own scrapers, so the lane list is measured rather than
      # inherited. The question it exists for: which lanes are Google Drive, and
      # would adding them re-admit what six sources were already refused for?
      - name: Survey every nxsha lane
        continue-on-error: true
        timeout-minutes: 14
        run: |
          set -o pipefail
          node scripts/research/nxsha-lanes.mjs 2>&1 | tee research/nxsha-lanes-last.txt
        env:
          NODE_OPTIONS: --dns-result-order=ipv4first

      # The host probe cannot tell two libraries on one CDN from a re-export.
      # This one compares the media OBJECT ids, which can.
      - name: Probe content overlap
        continue-on-error: true
        run: |
          set -o pipefail
          node scripts/research/object-overlap.mjs 2>&1 | tee research/object-overlap-last.txt
        env:
          NODE_OPTIONS: --dns-result-order=ipv4first

      # A plain `git push` here loses a race against a human push that lands
      # while the job is running: the result is computed, then thrown away with
      # a non-fast-forward. Rebase and retry instead — the probe result is the
      # only evidence this job produces, so losing it wastes the whole run.
      - name: Record the verdict on the branch
        if: always()
        run: |
          git config user.name "source research"
          git config user.email "research@example.invalid"
          git add research/independence.json research/independence.md research/independence-last.txt \
                  research/object-overlap.json research/object-overlap-last.txt \
                  research/nxsha-probe.json research/nxsha-probe-last.txt \
                  research/nxsha-lanes.json research/nxsha-lanes-last.txt \
                  research/anivortex-426.json research/anivortex-426-last.txt \
                  research/upstream-lookup.json research/upstream-lookup-last.txt \
                  research/vidly-deep.json research/vidly-deep-last.txt \
                  research/vidly-streams.json research/vidly-streams-last.txt \
                  research/vidly-stream-bytes.json research/vidly-stream-bytes-last.txt \
                  research/vidly-page-lang.json research/vidly-page-lang-last.txt \
                  research/nxsha-row-fields.json research/nxsha-row-fields-last.txt \
                  research/nxsha-row-liveness.json research/nxsha-row-liveness-last.txt \
                  research/nxsha-breaking-bad.json research/nxsha-breaking-bad-last.txt \
                  research/nxsha-castle-headers.json research/nxsha-castle-headers-last.txt \
                  research/nxsha-all-lanes.json research/nxsha-all-lanes-last.txt \
                  research/nxsha-castle-proof.json research/nxsha-castle-proof-last.txt \
                  research/nxsha-hindi-verify.json research/nxsha-hindi-verify-last.txt \
                  research/stremio-addon-survey.json research/stremio-addon-survey-last.txt
          # Report what was actually staged. A silent `git add` of a file the
          # probe never wrote leaves the commit empty and looks like success.
          echo "staged files:"
          git diff --cached --name-only | sed 's/^/  /'
          if git diff --cached --quiet; then
            echo "::warning::nothing staged — the probes wrote no files this run"
            exit 0
          fi
          git commit -m "Independence probe $(date -u +%Y-%m-%dT%H:%MZ)"

          # The push is the fragile part: this ran during a GitHub outage and the
          # measured data was lost with the job. Back off harder, and say plainly
          # what happened if it still fails, so the next reader knows the run has
          # results that simply are not on the branch.
          for attempt in 1 2 3 4 5 6; do
            if git push 2>&1 | tee /tmp/push.log; then
              echo "pushed on attempt $attempt"
              exit 0
            fi
            echo "::warning::push attempt $attempt failed: $(tail -2 /tmp/push.log | tr '\n' ' ')"
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" || true
            sleep $((attempt * 15))
          done
          echo "::error::the probes ran and wrote data, but six push attempts failed. The files are in this job's workspace; re-run the job to regenerate them."
          exit 1
          echo "could not push the verdict after 4 attempts"
          exit 1

      - name: Summary
        if: always()
        run: |
          echo "::notice title=Independence probe::see research/independence.md and research/independence-last.txt"
