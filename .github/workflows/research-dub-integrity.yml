name: Dub integrity research
on:
  push:
    branches: [arena/dcf86284-elfura]
    paths: [backend/test/research-dub-integrity.mjs, .github/workflows/research-dub-integrity.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node backend/test/research-dub-integrity.mjs
