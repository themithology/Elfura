name: Provider isolation audit
on:
  push:
    branches: [arena/dcf86284-elfura]
    paths: [backend/test/provider-isolation-audit.mjs, .github/workflows/provider-isolation-audit.yml]
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run build:backend
      - run: node backend/test/provider-isolation-audit.mjs
