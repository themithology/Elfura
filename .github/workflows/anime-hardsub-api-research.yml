name: Hard subtitle API research
on:
  push:
    branches: [arena/124b7afe-elfura]
    paths: ['backend/test/anime-hardsub-api-research.mjs', '.github/workflows/anime-hardsub-api-research.yml']
  workflow_dispatch:
permissions: {contents: read}
jobs:
  survey:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - run: node backend/test/anime-hardsub-api-research.mjs
