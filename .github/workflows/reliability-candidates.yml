name: Independent provider discovery
on:
  push:
    branches: [arena/124b7afe-elfura]
    paths: ['backend/test/reliability-candidate-research.mjs', '.github/workflows/reliability-candidates.yml']
  workflow_dispatch:
permissions: {contents: read}
jobs:
  survey:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22, cache: npm}
      - run: npm ci
      - run: node backend/test/reliability-candidate-research.mjs
