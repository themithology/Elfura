name: Research Bingr native streams
on:
  push:
    branches: [arena/dcf86284-elfura]
    paths: [backend/test/research-bingr-streams.mjs, .github/workflows/research-bingr-streams.yml]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node backend/test/research-bingr-streams.mjs
