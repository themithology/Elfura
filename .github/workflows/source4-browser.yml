name: Multi-audio anime browser verification
on:
  push:
    branches: [arena/dcf86284-elfura]
    paths: [backend/src/sources/source4.ts, backend/test/source4-browser.mjs, .github/workflows/source4-browser.yml]
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        mode: [normal, expired, titan]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npm install --no-save --no-package-lock playwright-core @sparticuz/chromium
      - run: node backend/test/source4-browser.mjs
        env:
          TEST_EXPIRED: ${{ matrix.mode == 'expired' && '1' || '0' }}
          ANIME_TEST_ID: ${{ matrix.mode == 'titan' && '1429' || '95479' }}
